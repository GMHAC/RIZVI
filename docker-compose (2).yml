services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rizvi360
      POSTGRES_USER: rizvi
      POSTGRES_PASSWORD: change-me-now
    volumes: [rizvi_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U rizvi -d rizvi360"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rizvi:change-me-now@db:5432/rizvi360
      JWT_SECRET: replace-this-with-a-long-random-secret
      UPLOAD_DIR: /app/uploads
    volumes: [./uploads:/app/uploads]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: [./frontend:/app]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  rizvi_db:

name: rizvi_dynamic_management_system
description: Dynamic, configuration-driven management dashboard engine for RIZVI Fashions.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rose/rose_red.svg
    - assets/rose/rose_yellow.svg
    - lib/config/dashboard_config.json
    - assets/watermark/rose_red_watermark.png
    - assets/watermark/rose_yellow_watermark.png
    - assets/reference/executive_hr_dashboard_reference.png

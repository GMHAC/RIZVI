<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#10182d"><title>RIZVI FAMILY • Secure Login</title><link rel="stylesheet" href="styles.css"><style>body{display:grid;place-items:center;min-height:100vh;background:#10182d}.login{width:min(460px,94vw);background:#fff;border-radius:18px;padding:26px;box-shadow:0 25px 80px #0007}.login h1{margin:0 0 6px}.tabs{display:flex;gap:5px;margin:18px 0;background:#eef2f7;padding:5px;border-radius:10px}.tabs button{flex:1;border:0;padding:10px;border-radius:8px;font-weight:700}.tabs .active{background:#10182d;color:white}.login label{display:block;margin:12px 0;font-size:12px;font-weight:700}.login input{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:8px;margin-top:5px}.login .primary{width:100%;padding:12px;border:0;border-radius:8px;background:#174ea6;color:#fff;font-weight:800}.muted{color:#667085;font-size:12px}.msg{min-height:20px;margin-top:10px;font-size:12px}.error{color:#b42318}.ok{color:#067647}.note{margin-top:15px;padding:10px;background:#f5f7fa;border-radius:8px;font-size:11px;color:#667085}</style></head><body><div class="login"><div class="brand">RF <span>RIZVI FAMILY</span></div><h1>Secure Sign In</h1><p class="muted">Firebase-powered IMPMS</p><div class="tabs"><button id="at" class="active">Admin</button><button id="et">Employee</button></div><section id="ab"><label>Admin Username<input id="au" value="Admin" autocomplete="username"></label><label>Password<input id="ap" type="password" autocomplete="current-password"></label><button id="as" class="primary">Sign In</button><div id="am" class="msg"></div><div class="note">Initial requested credential: Admin / Admin123456. Production should provision the same account in Firebase Authentication.</div></section><section id="eb" hidden><label>Official ID Number<input id="eid" placeholder="Official Employee ID"></label><button id="es" class="primary">Sign In as Employee</button><div id="em" class="msg"></div><div class="note">Only an employee found in <b>master_employee</b> with <b>ACTIVE</b> status is accepted.</div></section></div><script type="module">import{auth,db,signInWithEmailAndPassword,signInAnonymously,collection,query,where,getDocs}from './firebase.js';
const $=id=>document.getElementById(id);$('at').onclick=()=>{ab.hidden=false;eb.hidden=true;at.classList.add('active');et.classList.remove('active')};$('et').onclick=()=>{ab.hidden=true;eb.hidden=false;et.classList.add('active');at.classList.remove('active')};
$('as').onclick=async()=>{am.textContent='Signing in…';am.className='msg ok';if($('au').value.trim()!=='Admin'||$('ap').value!=='Admin123456'){am.textContent='Invalid Admin username or password.';am.className='msg error';return}try{await signInWithEmailAndPassword(auth,'admin@rizvi-management.local',$('ap').value);sessionStorage.setItem('rizvi_role','Admin');location.href='index.html'}catch(e){am.textContent='Firebase Admin account is not provisioned. Create admin@rizvi-management.local with the requested password in Firebase Authentication.';am.className='msg error'}};
$('es').onclick=async()=>{em.textContent='Checking Master Employee…';em.className='msg ok';const id=$('eid').value.trim();if(!id){em.textContent='Official ID is required.';em.className='msg error';return}try{await signInAnonymously(auth);let q=query(collection(db,'master_employee'),where('officialId','==',id),limit(1));let s=await getDocs(q);if(s.empty){q=query(collection(db,'master_employee'),where('employeeId','==',id),limit(1));s=await getDocs(q)}if(s.empty)throw Error('Official ID was not found in Master Employee.');const e=s.docs[0].data();if(String(e.status||'ACTIVE').toUpperCase()!=='ACTIVE')throw Error('Employee is not ACTIVE.');sessionStorage.setItem('rizvi_role','Employee');sessionStorage.setItem('rizvi_employee',JSON.stringify({id:s.docs[0].id,...e}));location.href='index.html'}catch(e){em.textContent=e.message;em.className='msg error'}};</script></body></html>
